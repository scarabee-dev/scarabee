version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  apt_packages:
    - cmake
    - g++
    - libomp-dev 
    - libhdf5-dev
  jobs:
    pre_build:
      - python -m pip install --no-cache-dir -v .

sphinx:
  configuration: docs/source/conf.py

python:
  install:
    - requirements: docs/requirements.txt
